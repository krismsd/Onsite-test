# Build the service tool and publish it to GitHub Pages.
#
# Pages serves over HTTPS, which WebUSB requires: the browser must be running
# on the laptop the adapter is plugged into, and the page must come from a
# secure context. A plain http:// URL on the local network will load the page
# but leave WebUSB unavailable.
#
# One-time setup, needed once per repository:
#   Settings > Pages > Build and deployment > Source: "GitHub Actions"
#
# The workflow cannot do this for you. Creating a Pages site requires admin
# rights, which the automatically provided workflow token does not have, so
# configure-pages with enablement:true fails with "Resource not accessible by
# integration". The preflight step below checks for it and says so plainly.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/cummings-insite-recreation-87qqec
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Turn the opaque "Not Found" from configure-pages into an instruction.
      - name: Check that Pages is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "GitHub Pages is enabled."
            exit 0
          fi
          {
            echo "## GitHub Pages is not enabled for this repository"
            echo
            echo "Enable it once, by hand:"
            echo
            echo "**Settings → Pages → Build and deployment → Source: \"GitHub Actions\"**"
            echo
            echo "Then re-run this workflow. The build itself succeeded — only publishing is blocked."
            echo
            echo "This cannot be automated: creating a Pages site needs admin rights, which the"
            echo "workflow token does not have."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=GitHub Pages not enabled::Settings > Pages > Build and deployment > Source: GitHub Actions, then re-run this workflow."
          exit 1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
