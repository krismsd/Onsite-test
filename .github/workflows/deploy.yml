# Build the service tool and publish it to GitHub Pages.
#
# Pages serves over HTTPS, which WebUSB requires: the browser must be running
# on the laptop the adapter is plugged into, and the page must come from a
# secure context. A plain http:// URL on the local network will load the page
# but leave WebUSB unavailable.
#
# The configure-pages step enables Pages automatically on first run, so there
# is no manual settings step. If your organisation policy blocks that, set it
# by hand: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/cummings-insite-recreation-87qqec
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # enablement turns Pages on via the API when it has never been enabled,
      # so no manual repository-settings step is needed.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
